<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lançamento de Comissões</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="img/chaveirologo.png">
</head>
<body>

  <!-- Menu de Navegação -->
  <nav class="nav-bar">
    <a href="index.html" class="nav-btn active">Lançar Comissão</a>
    <a href="funcionarios.html" class="nav-btn">👥 Ver Comissões por Funcionário</a>
    <a href="folgas.html" class="nav-btn">📅 Escala de Folgas</a>
  </nav>

  <div class="container">
    
    <!-- Container Circular da Logo -->
    <div class="logo-container" style="text-align: center; margin: 20px 0;">
      <label for="inputLogo" class="logo-circle" style="cursor: pointer; display: inline-block; width: 120px; height: 120px; border-radius: 50%; overflow: hidden; border: 2px dashed #cbd5e1; position: relative;">
        
        <!-- Aponta diretamente para a pasta img/ -->
        <img id="logoImg" src="img/chaveirologo.png" alt="Logo Chaveiro" style="width: 100%; height: 100%; object-fit: cover; display: block;">
        
        <span id="logoText" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; font-size: 12px; color: #64748b;">
          Clique para adicionar sua logo
        </span>
        
        <input type="file" id="inputLogo" accept="image/*" onchange="carregarLogo(event)" style="display: none;">
      </label>
    </div>

    <h1>Sistema de Lançamento de Comissões</h1>

    <!-- Alerta Dinâmico -->
    <div id="mensagemAlerta" class="alert-success" style="display: none;"></div>

    <!-- Formulário de Lançamento -->
    <div class="card">
      <h2>Novo Serviço</h2>
      
      <div class="form-group">
        <label for="dataServico">Data do Serviço:</label>
        <input type="date" id="dataServico" required>
      </div>

      <div class="form-group">
        <label for="funcionario">Nome do Funcionário:</label>
        <input type="text" id="funcionario" placeholder="Ex: Lucas, Rodrigo, Kleber, Jota, Maicon..." required>
      </div>

      <div class="form-group">
        <label for="descricao">Descrição do Serviço:</label>
        <input type="text" id="descricao" placeholder="Ex: Abertura, Troca de segredo, Visita..." required>
      </div>

      <div class="form-group">
        <label for="valor">Valor do Serviço (R$):</label>
        <input type="number" id="valor" step="0.10" placeholder="0,00" oninput="calcularPreviewComissao()" required>
      </div>

      <div class="preview-box">
        <span>Comissão Prévia (5%):</span>
        <strong id="previewComissao">R$ 0,00</strong>
      </div>

      <button class="btn-primary" onclick="adicionarServico()">Salvar Comissão</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
</html>
